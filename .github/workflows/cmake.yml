name: cmake

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 10G

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-ccache-gcc-x64-release
          path: /home/runner/.ccache

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          ccache -z

      - name: configure
        run: |
          start=$(date +%s)
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "CONFIGURE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: build
        run: |
          start=$(date +%s)
          cmake --build build -j"$(nproc)"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: test
        run: |
          start=$(date +%s)
          mkdir -p test-results
          ctest --test-dir build --output-on-failure --output-junit "$GITHUB_WORKSPACE/test-results/ctest.xml"
          echo "TEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: summary
        if: always()
        run: |
          {
            echo "### CMake"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | ${{ runner.environment }} |"
            echo "| OS | $(. /etc/os-release && echo "$PRETTY_NAME") |"
            echo "| vCPU | $(nproc) |"
            echo "| CPU | $(lscpu | sed -n 's/^Model name:[[:space:]]*//p') |"
            echo "| Compiler | $(gcc --version | head -1) |"
            echo "| CMake | $(cmake --version | head -1) |"
            echo "| Configure (incl. dependency fetch) | ${CONFIGURE_SECONDS:-n/a}s |"
            echo "| Build | ${BUILD_SECONDS:-n/a}s |"
            echo "| Test | ${TEST_SECONDS:-n/a}s |"
            echo
            echo '```'
            ccache -s || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
